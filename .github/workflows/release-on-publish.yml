name: Build Release on Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build release for'
        required: true

jobs:
  build-release:
    runs-on: windows-latest

    strategy:
      matrix:
        runtime: [win-x64, win-x86]
        selfContained: [true]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Get version from tag
      id: version
      run: |
        $tag = "${{ github.event.release.tag_name || github.event.inputs.tag }}"
        # 正确的 GitHub Actions 输出格式
        "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      shell: pwsh

    - name: Update App.xaml.cs with full version info
      run: |
        $filePath = "StickyHomeworks/App.xaml.cs"
        $content = Get-Content $filePath -Raw
        $content = $content -replace 'public static string FullAppVersion { get; set; } = "v" \+ AppVersion;', "public static string FullAppVersion { get; set; } = `"$env:tag`";"
        Set-Content $filePath $content
      shell: pwsh

    - name: Install dependencies
      run: dotnet restore

    - name: Build project
      run: |
        dotnet publish StickyHomeworks/StickyHomeworks.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishSingleFile=true -o ./publish-${{ matrix.runtime }}/

    - name: Create release archives
      run: |
        $version = "${{ steps.version.outputs.tag }}"
        cd publish-${{ matrix.runtime }}
        Compress-Archive -Path * -DestinationPath ../sticky-attentions-forked-$version-${{ matrix.runtime }}.zip
      shell: pwsh

    - name: Upload assets to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        files: |
          sticky-attentions-forked-${{ steps.version.outputs.tag }}-*.zip
        prerelease: ${{ github.event.release.prerelease || false }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: sticky-attentions-forked-${{ steps.version.outputs.tag }}-${{ matrix.runtime }}
        path: sticky-attentions-forked-${{ steps.version.outputs.tag }}-${{ matrix.runtime }}.zip