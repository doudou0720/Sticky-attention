name: Build Release on Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build release for'
        required: true

jobs:
  build-release:
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - runtime: win-x64
            selfContained: true
            output_suffix: "-win-x64"
          - runtime: win-x86
            selfContained: true
            output_suffix: "-win-x86"
          - runtime: ""
            selfContained: false
            output_suffix: "-framework-dependent"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Get version from tag
      id: version
      run: |
        $tag = "${{ github.event.release.tag_name || github.event.inputs.tag }}"
        "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      shell: pwsh

    - name: Parse version components
      id: version_components
      run: |
        $tag = "${{ steps.version.outputs.tag }}"
        # 移除可能的 "v" 前缀
        if ($tag.StartsWith("v")) {
          $tag = $tag.Substring(1)
        }
        
        # 分离主版本号和预发布标签
        $parts = $tag -split '-', 2
        $version = $parts[0]
        if ($parts.Length -gt 1) {
          $preRelease = $parts[1]
          "preRelease=$preRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        } else {
          "preRelease=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        }
        
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      shell: pwsh

    - name: Install dependencies
      run: dotnet restore

    - name: Build Web project
      run: |
        $informationalVersion = "${{ steps.version.outputs.tag }}"
        $version = "${{ steps.version_components.outputs.version }}"
        if ("${{ matrix.runtime }}" -eq "") {
          dotnet publish StickyHomeworks.Web/StickyHomeworks.Web.csproj -c Release --self-contained ${{ matrix.selfContained }} -p:PublishSingleFile=true -p:Version=$version -p:InformationalVersion=$informationalVersion -o ./publish-web${{ matrix.output_suffix }}/
        } else {
          dotnet publish StickyHomeworks.Web/StickyHomeworks.Web.csproj -c Release -r ${{ matrix.runtime }} --self-contained ${{ matrix.selfContained }} -p:PublishSingleFile=true -p:Version=$version -p:InformationalVersion=$informationalVersion -o ./publish-web${{ matrix.output_suffix }}/
        }
      shell: pwsh

    - name: Build main project
      run: |
        $informationalVersion = "${{ steps.version.outputs.tag }}"
        $version = "${{ steps.version_components.outputs.version }}"
        if ("${{ matrix.runtime }}" -eq "") {
          dotnet publish StickyHomeworks/StickyHomeworks.csproj -c Release --self-contained ${{ matrix.selfContained }} -p:PublishSingleFile=true -p:Version=$version -p:InformationalVersion=$informationalVersion -o ./publish${{ matrix.output_suffix }}/
        } else {
          dotnet publish StickyHomeworks/StickyHomeworks.csproj -c Release -r ${{ matrix.runtime }} --self-contained ${{ matrix.selfContained }} -p:PublishSingleFile=true -p:Version=$version -p:InformationalVersion=$informationalVersion -o ./publish${{ matrix.output_suffix }}/
        }
      shell: pwsh

    - name: Copy Web executable to main output
      run: |
        Copy-Item -Path "./publish-web${{ matrix.output_suffix }}/StickyHomeworks.Web.exe" -Destination "./publish${{ matrix.output_suffix }}/"
      shell: pwsh

    - name: Create release archives
      run: |
        $version = "${{ steps.version.outputs.tag }}"
        cd publish${{ matrix.output_suffix }}
        Compress-Archive -Path * -DestinationPath ../sticky-attentions-forked-$version${{ matrix.output_suffix }}.zip
      shell: pwsh

    - name: Upload assets to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        files: |
          sticky-attentions-forked-${{ steps.version.outputs.tag }}-*.zip
        prerelease: ${{ github.event.release.prerelease || false }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: sticky-attentions-forked-${{ steps.version.outputs.tag }}${{ matrix.output_suffix }}
        path: sticky-attentions-forked-${{ steps.version.outputs.tag }}${{ matrix.output_suffix }}.zip