name: Build Check

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build-check:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install dependencies
      run: dotnet restore

    - name: Build project
      run: |
        dotnet build StickyHomeworks/StickyHomeworks.csproj -c Release

    - name: Check build result
      run: |
        if ($LASTEXITCODE -eq 0) {
          Write-Host "Build successful"
        } else {
          Write-Error "Build failed"
          exit $LASTEXITCODE
        }