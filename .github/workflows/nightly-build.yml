name: Nightly Build

on:
  push:
    branches:
      - dev/core
  workflow_dispatch:

jobs:
  build-nightly:
    runs-on: windows-latest
    
    strategy:
      matrix:
        runtime: [win-x64, win-x86]
        selfContained: [true]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install dependencies
      run: dotnet restore

    - name: Get version info
      id: version
      run: |
        echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "full_version=v1.1.7.7-nightly-$(date +'%Y%m%d')-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      shell: bash

    - name: Calculate suffix
      id: suffix
      run: |
        if [ "${{ matrix.selfContained }}" = "false" ]; then
          echo "suffix=-no-runtime" >> $GITHUB_OUTPUT
        else
          echo "suffix=" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Build Web project
      run: |
        $version = "1.1.7.7"
        $informationalVersion = "${{ steps.version.outputs.full_version }}"
        dotnet publish StickyHomeworks.Web/StickyHomeworks.Web.csproj -c Release -r ${{ matrix.runtime }} --self-contained ${{ matrix.selfContained }} -p:PublishSingleFile=true -p:Version=$version -p:InformationalVersion=$informationalVersion -o ./publish-web-${{ matrix.runtime }}${{ steps.suffix.outputs.suffix }}/

    - name: Build main project
      run: |
        $version = "1.1.7.7"
        $informationalVersion = "${{ steps.version.outputs.full_version }}"
        dotnet publish StickyHomeworks/StickyHomeworks.csproj -c Release -r ${{ matrix.runtime }} --self-contained ${{ matrix.selfContained }} -p:PublishSingleFile=true -p:Version=$version -p:InformationalVersion=$informationalVersion -o ./publish-${{ matrix.runtime }}${{ steps.suffix.outputs.suffix }}/

    - name: Copy Web executable to main output
      run: |
        Copy-Item -Path "./publish-web-${{ matrix.runtime }}${{ steps.suffix.outputs.suffix }}/StickyHomeworks.Web.exe" -Destination "./publish-${{ matrix.runtime }}${{ steps.suffix.outputs.suffix }}/"
      shell: pwsh

    - name: List files before archive
      run: dir
      shell: cmd

    - name: Create release archives
      run: |
        cd publish-${{ matrix.runtime }}${{ steps.suffix.outputs.suffix }}
        Compress-Archive -Path * -DestinationPath ../sticky-attentions-forked-nightly-${{ matrix.runtime }}${{ steps.suffix.outputs.suffix }}-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha_short }}.zip
      shell: pwsh

    - name: List files after archive
      run: dir *.zip
      shell: cmd

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sticky-attentions-forked-nightly-${{ matrix.runtime }}${{ steps.suffix.outputs.suffix }}-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha_short }}
        path: sticky-attentions-forked-nightly-${{ matrix.runtime }}${{ steps.suffix.outputs.suffix }}-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha_short }}.zip