name: Nightly Build

on:
  push:
    branches:
      - dev/core
  workflow_dispatch:

jobs:
  build-nightly:
    runs-on: windows-latest
    
    strategy:
      matrix:
        runtime: [win-x64, win-x86]
        selfContained: [true]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install dependencies
      run: dotnet restore

    - name: Build project
      run: |
        $suffix = ""
        if ($env:selfContained -eq "false") {
          $suffix = "-no-runtime"
        }
        
        dotnet publish StickyHomeworks/StickyHomeworks.csproj -c Release -r ${{ matrix.runtime }} --self-contained ${{ matrix.selfContained }} -p:PublishSingleFile=true -o ./publish-${{ matrix.runtime }}${suffix}/

    - name: Get version info
      id: version
      run: |
        echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      shell: bash

    - name: Create release archives
      run: |
        $suffix = ""
        if ($env:selfContained -eq "false") {
          $suffix = "-no-runtime"
        }
        
        cd publish-${{ matrix.runtime }}${suffix}
        Compress-Archive -Path * -DestinationPath ../sticky-attentions-forked-nightly-${{ matrix.runtime }}${suffix}-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha_short }}.zip
      shell: pwsh

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sticky-attentions-forked-nightly-${{ matrix.runtime }}${suffix}-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha_short }}
        path: sticky-attentions-forked-nightly-${{ matrix.runtime }}${suffix}-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha_short }}.zip